apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgeops-api
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/salikahmed49/ForgeOps.git
    targetRevision: HEAD
    path: charts/forgeops-api
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: forgeops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
