name: CI Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  security:
    name: Audit Python dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and auditor
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Scan dependencies
        run: pip-audit

  docker-build:
    name: Build and smoke test container
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t forgeops-api:${{ github.sha }} .

      - name: Start container and verify health
        run: |
          docker run -d --name forgeops-api -p 8000:8000 forgeops-api:${{ github.sha }}

          for i in {1..15}; do
            if curl --fail --silent http://localhost:8000/health; then
              echo "Container health check passed"
              docker rm -f forgeops-api
              exit 0
            fi
            sleep 2
          done

          docker logs forgeops-api
          docker rm -f forgeops-api
          exit 1
